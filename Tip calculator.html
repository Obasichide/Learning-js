<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="Tip calculator.css">
</head>
<body>
     <div class="header">

       <h1 class="head"> Discount Calculator</h1> 
       
       <div class="dashed line"></div>

       <div class="Bill amount"> 
<label>Bill Amount</label>

<div class="naira">

    <span>N</span>
    <input type="number" class="Bill" placeholder="o.oo" min="0" step="0.01" inputmode="numeric">

</div>
      
</div>
       
<div class="percent discount">
        <label>Percent Discount</label>
        <div discount options>
        <button class="tip button" data-tip="10%">10%</button>
        <button class="tip button" data-tip="15%">15%</button>
<button class="tip button" data-tip="20%">20%</button> 
    </div>
    <div class="six note"></div>
       </div>

       <div class="four"></div>

       <div class="dashed line"></div>
       
       <div class="totaled">
     <div class="totaled">  <span>Subtotal</span><span class="subtotal">N0.00</span></div>
      <div class="totaled"> <span>Discount</span><span class="discount">N0.00</span></div>
      <div class="totaled"> <span class="total">Total</span><span class="total">N0.00</span></div>
       </div>
       <div class="dashed line"></div>
       <p class="footer">THANK YOU</p>
    </div>
    <script src="Tip calculator.js"></script>
</body>
</html>
